<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>The Upside</title>
  <!-- Old link-preview page, kept so links in earlier emails still work.
       Since 16 Nov 2026 it shows nothing: it sends the reader straight to the
       story's own article. Only URLs taken from our stories.json (by id) are
       used, and only absolute http(s) ones, so it can't be an open redirect.
       Anything else goes to the feed. -->
  <noscript><meta http-equiv="refresh" content="0;url=./"></noscript>
  <script id="go-redirect">
(function () {
  var HOME = "./";
  function go(url) { window.location.replace(url); }
  function httpUrl(value) {
    try {
      var url = new URL(String(value == null ? "" : value).trim());
      if (url.protocol === "http:" || url.protocol === "https:") return url.href;
    } catch (e) { /* ignore */ }
    return "";
  }
  var id = "";
  try { id = (new URLSearchParams(window.location.search).get("id") || "").trim(); } catch (e) { id = ""; }
  if (!id) { go(HOME); return; }
  fetch("data/stories.json", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("missing feed");
      return res.json();
    })
    .then(function (data) {
      var stories = (data && data.stories) || [];
      var story = null;
      for (var i = 0; i < stories.length; i++) {
        if (stories[i] && String(stories[i].id) === id) { story = stories[i]; break; }
      }
      var first = story && Array.isArray(story.sources) ? story.sources[0] : null;
      var target = story ? (httpUrl(story.link) || httpUrl(first && first.url)) : "";
      go(target || HOME);
    })
    .catch(function () { go(HOME); });
})();
  </script>
</head>
<body></body>
</html>
